name: edtech_app
description: AI-powered personalized learning ecosystem
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # Firebase & Auth (Latest stable versions)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2

  # Storage & Database
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.3.0

  # File handling
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  flutter_pdfview: ^1.3.2
  pdf: ^3.10.7
  syncfusion_flutter_pdfviewer: ^31.2.15

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Audio
  audioplayers: ^5.2.1
  just_audio: ^0.9.36

  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  webview_flutter: ^4.4.4
  flutter_html: ^3.0.0-beta.2
  table_calendar: ^3.0.9
  timezone: ^0.9.2

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Charts & Visualization
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3

  # Markdown & Rich Text
  flutter_markdown: ^0.6.18+2
  google_fonts: ^6.3.3
  flip_card: ^0.7.0
  record: ^6.2.1
  web_socket_channel: ^3.0.3
  flutter_pcm_sound: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/animations/

